name: release

# push a tag like v0.1.0, or run it by hand with a version, and a signed apk lands on a github release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version without the v, like 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: version
        id: version
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: keystore
        env:
          KEYSTORE: ${{ secrets.HOTSEAT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "HOTSEAT_KEYSTORE_BASE64 is not set, an unsigned apk will not install"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > android/keystore/ci.jks

      - name: build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HOTSEAT_KEYSTORE_PASSWORD }}
          WORKER_URL: ${{ secrets.HOTSEAT_WORKER_URL }}
          APP_KEY: ${{ secrets.HOTSEAT_APP_KEY }}
        run: |
          ./gradlew assembleRelease --no-configuration-cache \
            -Photseat.versionName="${{ steps.version.outputs.name }}" \
            -Photseat.versionCode="${{ github.run_number }}" \
            -Photseat.keystore=keystore/ci.jks \
            -Photseat.keyAlias=hotseat \
            -Photseat.keystorePassword="$KEYSTORE_PASSWORD" \
            -Photseat.keyPassword="$KEYSTORE_PASSWORD" \
            -Photseat.workerUrl="$WORKER_URL" \
            -Photseat.appKey="$APP_KEY"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="hotseat-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes="Download $apk on an Android phone, open it and allow installing apps from your browser when asked."
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$apk" --clobber
          else
            gh release create "v$VERSION" "$apk" --title "Hotseat $VERSION" --notes "$notes" --target "$GITHUB_SHA"
          fi
